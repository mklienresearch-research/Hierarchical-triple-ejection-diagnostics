name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and tests
        run: python -m pip install -e '.[dev]'
      - name: Run causal and physics tests
        run: pytest
      - name: Compile direct Kaggle workflows
        run: |
          python -m py_compile workflows/kaggle/FINAL_ANALYSIS_4CORE.py
          python -m py_compile workflows/kaggle/FINAL_ANALYSIS_96.py
          python -m py_compile workflows/kaggle/FINAL_AUDIT_4CORE.py
          python -m py_compile workflows/kaggle/DEEPTAIL_100K_3000_CORRECTED.py
